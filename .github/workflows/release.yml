name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
env:
  CI: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
jobs:
  package:
    name: Package and managed-only audit
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Locked restore, pack three TFMs and audit the package
        run: dotnet run --project tools/MdfLib.Ci -- package
      - name: The package version must match the tag
        shell: bash
        run: test -f "artifacts/packages/MdfLibrary.Managed.${GITHUB_REF_NAME#v}.nupkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  mdfscope:
    name: MdfScope ${{ matrix.rid }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: apps/global.json
      - name: Self-contained single-file build
        working-directory: apps
        run: >
          dotnet publish MdfScope/MdfScope.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${GITHUB_REF_NAME#v} -o "$GITHUB_WORKSPACE/out/MdfScope"
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          rid="${{ matrix.rid }}"
          cd out
          rm -f MdfScope/*.pdb
          case "$rid" in
            win-*)
              zip -qr "../MdfScope-$version-$rid.zip" MdfScope ;;
            linux-*)
              chmod +x MdfScope/MdfScope
              tar -czf "../MdfScope-$version-$rid.tar.gz" MdfScope ;;
            osx-*)
              mkdir -p MdfScope.app/Contents/MacOS MdfScope.app/Contents/Resources
              cp -r MdfScope/. MdfScope.app/Contents/MacOS/
              chmod +x MdfScope.app/Contents/MacOS/MdfScope
              cat > MdfScope.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MdfScope</string>
            <key>CFBundleDisplayName</key><string>MdfScope</string>
            <key>CFBundleIdentifier</key><string>io.github.sensboston.mdfscope</string>
            <key>CFBundleExecutable</key><string>MdfScope</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict>
          </plist>
          EOF
              zip -qry "../MdfScope-$version-$rid.zip" MdfScope.app ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdfscope-${{ matrix.rid }}
          path: |
            MdfScope-*.zip
            MdfScope-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to NuGet and GitHub
    needs: [package, mdfscope]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: sensboston
      - name: Push to nuget.org
        run: dotnet nuget push dist/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "MdfLibrary.Managed ${GITHUB_REF_NAME#v}" --notes-file - <<'EOF'
          First release.

          **MdfLibrary.Managed** on NuGet: a fully managed port of mdflib with the API of the native `MdfLibrary` wrapper
          2.3.0. .NET Framework 4.8, .NET 8 and .NET 10; Windows, Linux and macOS.

              dotnet add package MdfLibrary.Managed

          **MdfScope**, the viewer and CAN capture tool, as self-contained builds (no .NET installation needed):
          Windows x64, Linux x64 and ARM64, macOS Intel and Apple Silicon. On macOS the application is not signed:
          after unpacking, run `xattr -dr com.apple.quarantine MdfScope.app` once.
          EOF
